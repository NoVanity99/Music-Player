name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Optional: sign with your release key if these repository secrets exist.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/musicplayer-release.jks
          cat > keystore.properties <<PROPS
          storeFile=keystore/musicplayer-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=musicplayer
          keyPassword=$KEYSTORE_PASSWORD
          PROPS

      - name: Build release APK
        run: ./gradlew :app:testDebugUnitTest :updatecore:test :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VanityPlayer-android
          path: app/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Windows installers
        shell: bash
        run: ./gradlew :desktopApp:packageReleaseExe :desktopApp:packageReleaseMsi --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: VanityPlayer-windows
          path: |
            desktopApp/build/compose/binaries/main-release/exe/*.exe
            desktopApp/build/compose/binaries/main-release/msi/*.msi
