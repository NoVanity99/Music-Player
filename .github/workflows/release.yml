name: Release

# Push a tag like v1.3.0 (matching app.versionName in gradle.properties) to build the signed
# Android APK and the Windows installers, sign the update manifest, and publish a GitHub Release.
# See RELEASING.md.

on:
  push:
    tags: ["v*"]
  # Or run it from the Actions tab on any branch: it tags that commit v<app.versionName>.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      android: ${{ steps.v.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check tag matches gradle.properties
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          version=$(grep '^app.versionName=' gradle.properties | cut -d= -f2)
          code=$(grep '^app.versionCode=' gradle.properties | cut -d= -f2)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.versionName=$version"; exit 1
          fi
          if [ ! -f "release-notes/$version.md" ]; then
            echo "::error::Missing release-notes/$version.md"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Without the keystore, publish the Windows installers only (an APK with another
          # key couldn't update existing installs anyway).
          if [ "$HAS_KEYSTORE" != "true" ]; then echo "::warning::KEYSTORE_BASE64 is not set; skipping the Android APK"; fi
          echo "android=$HAS_KEYSTORE" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Updates only install over the existing app when signed with the same key.
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/musicplayer-release.jks
          cat > keystore.properties <<PROPS
          storeFile=keystore/musicplayer-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=musicplayer
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/VanityPlayer-${{ needs.prepare.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installers
        shell: bash
        run: ./gradlew :desktopApp:packageReleaseExe :desktopApp:packageReleaseMsi --stacktrace
      - name: Collect
        shell: bash
        run: |
          v=${{ needs.prepare.outputs.version }}
          mkdir -p out
          cp desktopApp/build/compose/binaries/main-release/exe/*.exe "out/VanityPlayer-$v-Setup.exe"
          cp desktopApp/build/compose/binaries/main-release/msi/*.msi "out/VanityPlayer-$v.msi"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  publish:
    needs: [prepare, android, windows]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.android.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Build and sign latest.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CODE: ${{ needs.prepare.outputs.code }}
        run: |
          set -o pipefail
          cd dist
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            # No manifest: installed apps simply won't see this release as an update.
            echo "::warning::UPDATE_SIGNING_KEY is not set; publishing without latest.json (no in-app update)"
            sha256sum VanityPlayer-* > SHA256SUMS.txt
            exit 0
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          asset() { # file -> JSON object, or null when that file wasn't built
            [ -f "$1" ] || { echo null; return; }
            jq -n --arg f "$1" --arg u "$base/$1" --arg s "$(sha256sum "$1" | cut -d' ' -f1)" \
              --argjson n "$(stat -c%s "$1")" '{file:$f, url:$u, sha256:$s, size:$n}'
          }
          # The app installs the MSI (silent in-place upgrade); the Setup.exe is for first installs.
          jq -n --arg v "$VERSION" --argjson c "$CODE" --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile notes "../release-notes/$VERSION.md" \
            --argjson a "$(asset "VanityPlayer-$VERSION.apk")" \
            --argjson w "$(asset "VanityPlayer-$VERSION.msi")" \
            '{version:$v, versionCode:$c, publishedAt:$t, notes:$notes, android:$a, windows:$w}' > latest.json
          # Accept the key as pasted: full PEM, or just its base64 body, with any line endings.
          key=$(printf '%s' "$UPDATE_SIGNING_KEY" | tr -d '\r' | sed 's/\\n/\n/g')
          if ! grep -q -- '-----BEGIN' <<< "$key"; then
            key=$(printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n' "$(tr -d ' \n\t' <<< "$key")")
          fi
          printf '%s\n' "$key" > ../signing.pem
          # It must be the key whose public half is built into the apps, or they'd reject every update.
          expected=$(grep -o 'PUBLIC_KEY = "[^"]*"' ../shared/src/commonMain/kotlin/com/novanity/musicplayer/update/Updates.kt | cut -d'"' -f2)
          actual=$(openssl pkey -in ../signing.pem -pubout -outform DER 2>/dev/null | tail -c 32 | base64) || true
          if [ "$actual" != "$expected" ]; then
            rm ../signing.pem
            echo "::error::UPDATE_SIGNING_KEY isn't the update signing key (paste the whole of keystore/update-signing-key.pem)"
            exit 1
          fi
          openssl pkeyutl -sign -inkey ../signing.pem -rawin -in latest.json -out sig.bin
          rm ../signing.pem
          base64 -w0 sig.bin > latest.json.sig && rm sig.bin
          [ -s latest.json.sig ]
          sha256sum VanityPlayer-* latest.json > SHA256SUMS.txt
          cat latest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Re-running for a version that's already out refreshes its files (e.g. after adding secrets).
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --clobber
            gh release edit "v$VERSION" --notes-file "release-notes/$VERSION.md" --latest
            exit 0
          fi
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Vanity Player $VERSION" \
            --notes-file "release-notes/$VERSION.md" \
            --latest
