name: Release

# Push a tag like v1.3.0 (matching app.versionName in gradle.properties) to build the signed
# Android APK and the Windows installers, sign the update manifest, and publish a GitHub Release.
# See RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      android: ${{ steps.v.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Check tag matches gradle.properties
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          version=$(grep '^app.versionName=' gradle.properties | cut -d= -f2)
          code=$(grep '^app.versionCode=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.versionName=$version"; exit 1
          fi
          if [ ! -f "release-notes/$version.md" ]; then
            echo "::error::Missing release-notes/$version.md"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Without the keystore, publish the Windows installers only (an APK with another
          # key couldn't update existing installs anyway).
          if [ "$HAS_KEYSTORE" != "true" ]; then echo "::warning::KEYSTORE_BASE64 is not set; skipping the Android APK"; fi
          echo "android=$HAS_KEYSTORE" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Updates only install over the existing app when signed with the same key.
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/musicplayer-release.jks
          cat > keystore.properties <<PROPS
          storeFile=keystore/musicplayer-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=musicplayer
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace
      - run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/MusicPlayer-${{ needs.prepare.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installers
        shell: bash
        run: ./gradlew :desktopApp:packageReleaseExe :desktopApp:packageReleaseMsi --stacktrace
      - name: Collect
        shell: bash
        run: |
          v=${{ needs.prepare.outputs.version }}
          mkdir -p out
          cp desktopApp/build/compose/binaries/main-release/exe/*.exe "out/MusicPlayer-$v-Setup.exe"
          cp desktopApp/build/compose/binaries/main-release/msi/*.msi "out/MusicPlayer-$v.msi"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: out/* }

  publish:
    needs: [prepare, android, windows]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.android.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Build and sign latest.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CODE: ${{ needs.prepare.outputs.code }}
        run: |
          cd dist
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            # No manifest: installed apps simply won't see this release as an update.
            echo "::warning::UPDATE_SIGNING_KEY is not set; publishing without latest.json (no in-app update)"
            sha256sum MusicPlayer-* > SHA256SUMS.txt
            exit 0
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          asset() { # file -> JSON object, or null when that file wasn't built
            [ -f "$1" ] || { echo null; return; }
            jq -n --arg f "$1" --arg u "$base/$1" --arg s "$(sha256sum "$1" | cut -d' ' -f1)" \
              --argjson n "$(stat -c%s "$1")" '{file:$f, url:$u, sha256:$s, size:$n}'
          }
          # The app installs the MSI (silent in-place upgrade); the Setup.exe is for first installs.
          jq -n --arg v "$VERSION" --argjson c "$CODE" --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --rawfile notes "../release-notes/$VERSION.md" \
            --argjson a "$(asset "MusicPlayer-$VERSION.apk")" \
            --argjson w "$(asset "MusicPlayer-$VERSION.msi")" \
            '{version:$v, versionCode:$c, publishedAt:$t, notes:$notes, android:$a, windows:$w}' > latest.json
          printf '%s\n' "$UPDATE_SIGNING_KEY" > ../signing.pem
          openssl pkeyutl -sign -inkey ../signing.pem -rawin -in latest.json | base64 -w0 > latest.json.sig
          rm ../signing.pem
          sha256sum MusicPlayer-* latest.json > SHA256SUMS.txt
          cat latest.json
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --title "Music Player $VERSION" \
            --notes-file "release-notes/$VERSION.md" \
            --latest
