  <circle cx="82.6" cy="49.2" r="3.4" fill="#FFFFFF"/>
  <!-- Beamed double note (stems meet each head's rightmost point) -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.9" stroke-linejoin="round" transform="translate(-1.2 0)">
    <path d="M 48.6 38.0 L 73.6 32.4 L 73.6 40.0 L 48.6 45.6 Z"/>
