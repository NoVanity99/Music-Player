<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="1024" height="1024">
  <clipPath id="squircle"><rect x="2" y="2" width="104" height="104" rx="24" ry="24"/></clipPath>
  <g clip-path="url(#squircle)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4D6D"/>
      <stop offset="0.5" stop-color="#E8306E"/>
      <stop offset="1" stop-color="#6B2BFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="30" cy="22" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
